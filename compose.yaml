services:
  web:
    image: ghcr.io/nycu-winlab/carrel.winlab.tw:${SITE_VERSION:-main}
    build: .
    ports:
      - "${SITE_BIND:-127.0.0.1:8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

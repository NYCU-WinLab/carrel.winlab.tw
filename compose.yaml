services:
  web:
    image: ghcr.io/nycu-winlab/carrel.winlab.tw:${SITE_VERSION:-main}
    build: .
    ports:
      - "${SITE_BIND:-127.0.0.1:8080}:8080"
    restart: unless-stopped
    init: true
    stop_grace_period: 3s
    environment:
      SITE_VERSION: ${SITE_VERSION:-dev}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

name: release

# A push to main deploys the image ci passed to VM 117 through land: ship
# retags tree-<tree> as sha-<commit> and main, then carrel-deployd on the VM
# runs deploy/carrel-start.sh.
on:
  push:
    branches: [main]

jobs:
  ship:
    uses: zyx1121/.github/.github/workflows/ship.yml@main
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    with:
      images: '["ghcr.io/nycu-winlab/carrel.winlab.tw"]'
      target: land
      tenant: compose
      app: carrel-site

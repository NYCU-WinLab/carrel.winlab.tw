name: release

# A push to main retags the image ci passed (tree-<tree>) as sha-<commit> and
# main. The public site is served by Carrel (CT 101), which this does not
# deploy.
on:
  push:
    branches: [main]

jobs:
  ship:
    uses: zyx1121/.github/.github/workflows/ship.yml@main
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    with:
      images: '["ghcr.io/nycu-winlab/carrel.winlab.tw"]'
      target: none
